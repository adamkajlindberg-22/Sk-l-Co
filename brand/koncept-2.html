<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>SKÅL & CO · logotypkoncept 2</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=IBM+Plex+Mono:wght@400;500&family=Hanken+Grotesk:wght@400&display=block" rel="stylesheet">
<style>
:root{--dk:#141110;--ink:#eee5d6;--gold:#c49a5e;--lt:#f3eee6;--ink2:#22201d;--gold2:#765c2f}
*{box-sizing:border-box;margin:0}
body{background:#0c0a09;color:var(--ink);font-family:"Hanken Grotesk",sans-serif;padding:40px;width:1600px}
h1{font-family:Fraunces;font-weight:300;font-size:44px;margin-bottom:6px}
.sub{font-family:"IBM Plex Mono";font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:34px}
.c{display:grid;grid-template-columns:250px 1fr 1fr;gap:16px;margin-bottom:26px}
.info h2{font-family:Fraunces;font-weight:400;font-size:28px;margin:6px 0 10px}
.info .n{font-family:"IBM Plex Mono";font-size:12px;letter-spacing:.18em;color:var(--gold)}
.info p{font-size:15px;line-height:1.5;color:#b9ad9c}
.tile{border-radius:18px;padding:30px;display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center;min-height:340px}
.tile.dk{background:var(--dk);color:var(--ink);--acc:var(--gold);--bg:var(--dk)}
.tile.lt{background:var(--lt);color:var(--ink2);--acc:var(--gold2);--bg:var(--lt)}
.side{display:flex;flex-direction:column;gap:22px;font-family:"IBM Plex Mono";font-size:10.5px;letter-spacing:.14em;opacity:.85}
.side .r{display:flex;align-items:center;gap:12px}
.fav{width:32px;height:32px;border-radius:7px;display:grid;place-items:center}
.dk .fav{background:#221c18}.lt .fav{background:#e6ddcf}
.nav{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px}
.dk .nav{background:#1b1714}.lt .nav{background:#ebe4d8}
svg text{font-family:Fraunces}
</style>
</head>
<body>
<h1>SKÅL &amp; CO · nya förslag</h1>
<div class="sub">Namnet följer glaset · visning · vektorer</div>

<svg width="0" height="0" style="position:absolute"><defs>

<!-- 1. Bågen: namnet i en båge över en coupe -->
<symbol id="bagen" viewBox="0 0 200 200">
  <path id="b-arc" d="M 30 112 A 78 78 0 0 1 170 112" fill="none"/>
  <text font-size="25" letter-spacing="3.2" fill="currentColor"><textPath href="#b-arc" startOffset="50%" text-anchor="middle">SKÅL <tspan fill="var(--acc)" font-weight="300">&amp;</tspan> CO</textPath></text>
  <g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M58 104 H142"/><path d="M58 104 C60 136 140 136 142 104"/><path d="M100 128 V168"/><path d="M82 171 Q100 166 118 171"/>
  </g>
  <path d="M60.5 113 H139.5 C135 130 117 133.5 100 133.5 C83 133.5 65 130 60.5 113 Z" fill="var(--acc)"/>
  <g fill="var(--acc)"><circle cx="95" cy="94" r="1.9"/><circle cx="104" cy="86" r="1.4"/><circle cx="98" cy="78" r="1.1"/></g>
</symbol>
<symbol id="bagen-ikon" viewBox="0 0 100 100">
  <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 34 H84"/><path d="M16 34 C18 62 82 62 84 34"/><path d="M50 55 V80"/><path d="M34 84 Q50 79 66 84"/></g>
  <path d="M19 42 H81 C77 56 63 59 50 59 C37 59 23 56 19 42 Z" fill="var(--acc)"/>
  <g fill="var(--acc)"><circle cx="46" cy="22" r="4"/><circle cx="56" cy="12" r="3"/></g>
</symbol>

<!-- 2. Graverat: namnet längs kanten på ett glas sett snett uppifrån -->
<symbol id="graverat" viewBox="0 0 200 200">
  <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="100" cy="34" rx="58" ry="12"/>
    <path d="M42 34 C40 100 72 124 100 124 C128 124 160 100 158 34"/>
    <path d="M100 124 V168"/><ellipse cx="100" cy="172" rx="28" ry="5.5"/>
  </g>
  <path id="g-arc" d="M 50 64 C 70 80 130 80 150 64" fill="none"/>
  <text font-size="14.5" letter-spacing="3.6" fill="currentColor"><textPath href="#g-arc" startOffset="50%" text-anchor="middle">SKÅL &amp; CO</textPath></text>
  <path d="M47 88 C60 94 80 97 100 97 C120 97 140 94 153 88 C146 110 124 121.5 100 121.5 C76 121.5 54 110 47 88 Z" fill="var(--acc)" opacity=".92"/>
</symbol>
<symbol id="graverat-ikon" viewBox="0 0 100 100">
  <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"><ellipse cx="50" cy="22" rx="32" ry="8"/><path d="M18 22 C17 54 34 66 50 66 C66 66 83 54 82 22"/><path d="M50 66 V86"/><path d="M36 90 H64"/></g>
  <path d="M20 38 C28 38 38 44 50 44 C62 44 72 38 80 38 C77 56 64 64 50 64 C36 64 23 56 20 38 Z" fill="var(--acc)"/>
</symbol>

<!-- 3. Valvet: namnet längs ett valv, glaset inuti, sortimentet under -->
<symbol id="valvet" viewBox="0 0 200 200">
  <path d="M44 184 V84 A56 56 0 0 1 156 84 V184" fill="none" stroke="currentColor" stroke-width="2.2"/>
  <path id="v-arc" d="M 62 90 A 38 38 0 0 1 138 90" fill="none"/>
  <text font-size="12.5" letter-spacing="2.6" fill="currentColor"><textPath href="#v-arc" startOffset="50%" text-anchor="middle">SKÅL <tspan fill="var(--acc)">&amp;</tspan> CO</textPath></text>
  <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78 100 C76 132 87 144 100 144 C113 144 124 132 122 100"/><path d="M100 144 V170"/><path d="M87 173 Q100 169 113 173"/>
  </g>
  <path d="M77.7 118 H122.3 C121 135 111 143 100 143 C89 143 79 135 77.7 118 Z" fill="var(--acc)"/>
  <path d="M28 184 H172" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
</symbol>
<symbol id="valvet-ikon" viewBox="0 0 100 100">
  <path d="M18 94 V42 A32 32 0 0 1 82 42 V94 Z" fill="none" stroke="currentColor" stroke-width="5"/>
  <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"><path d="M36 36 C35 58 42 66 50 66 C58 66 65 58 64 36"/><path d="M50 66 V82"/><path d="M41 85 H59"/></g>
  <path d="M36.3 48 H63.7 C62.5 59 57 64.5 50 64.5 C43 64.5 37.5 59 36.3 48 Z" fill="var(--acc)"/>
</symbol>

<!-- 4. I glaset: namnet längs kupans insida, drycken under -->
<symbol id="iglaset" viewBox="0 0 200 200">
  <g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M38 28 C34 96 64 128 100 128 C136 128 166 96 162 28"/>
    <path d="M100 128 V170"/><path d="M80 174 Q100 168 120 174"/>
  </g>
  <path id="i-arc" d="M 52 86 C 64 100 82 105 100 105 C 118 105 136 100 148 86" fill="none"/>
  <text font-size="15.5" letter-spacing="3.4" fill="currentColor"><textPath href="#i-arc" startOffset="50%" text-anchor="middle">SKÅL &amp; CO</textPath></text>
  <path d="M55 102 C68 112 84 116 100 116 C116 116 132 112 145 102 C134 119 117 125.5 100 125.5 C83 125.5 66 119 55 102 Z" fill="var(--acc)"/>
</symbol>
<symbol id="iglaset-ikon" viewBox="0 0 100 100">
  <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"><path d="M20 12 C17 52 33 66 50 66 C67 66 83 52 80 12"/><path d="M50 66 V86"/><path d="M36 90 H64"/></g>
  <path d="M21.8 38 H78.2 C76 56 63 64 50 64 C37 64 24 56 21.8 38 Z" fill="var(--acc)"/>
</symbol>
</defs></svg>

<script>
const C=[
 ["01","Bågen","Namnet i en båge över en coupe, och bubblor som stiger mot det. Klassiskt och festligt, som en etikett på en champagneflaska. Ikonen är coupen med bubblor.","bagen"],
 ["02","Graverat","Ett vinglas sett snett uppifrån, där namnet följer kanten som en gravyr. Knyter an till att vi graverar glas och förklarar dem på riktigt.","graverat"],
 ["03","Valvet","Namnet följer ett valv med glaset inuti, samma valv som i Mitt glasskåp. Som ett skåp eller en nisch där glaset står utställt. Lugn lyx, galleri.","valvet"],
 ["04","I glaset","Namnet böjer sig längs kupans insida, precis ovanför drycken. Glaset bär namnet. Enkel linje, mycket luft, tydligt glas.","iglaset"]];
document.body.insertAdjacentHTML("beforeend",C.map(([n,h,p,id])=>`<div class="c"><div class="info"><span class="n">${n}</span><h2>${h}</h2><p>${p}</p></div>
${["dk","lt"].map(t=>`<div class="tile ${t}"><svg width="230" height="230"><use href="#${id}"/></svg>
<div class="side"><div class="r"><span class="fav"><svg width="26" height="26"><use href="#${id}-ikon"/></svg></span><span class="fav" style="width:16px;height:16px;border-radius:4px"><svg width="14" height="14"><use href="#${id}-ikon"/></svg></span>FAVICON</div>
<div class="r"><span class="nav"><svg width="30" height="30"><use href="#${id}-ikon"/></svg><span style="font-family:Fraunces;font-size:20px;letter-spacing:.14em;opacity:1">SKÅL <span style="color:var(--acc)">&amp;</span> CO</span></span></div><span>MENYRAD</span></div></div>`).join("")}</div>`).join(""));
</script>
</body>
</html>
